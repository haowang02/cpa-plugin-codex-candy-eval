<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 糖果测试</title>
  <style>
    :root {
      --bg: #f2f5f3; --surface: #ffffff; --sunken: #f7f9f8; --ink: #15201b; --muted: #66726c; --faint: #a0aaa5; --line: #e1e7e4;
      --apple: #2b9a58; --apple-ink: #1d7a43; --apple-soft: #e5f4ea; --apple-soft-hover: #d5ecdd; --peach: #e0533f; --peach-soft: #fceae6;
      --peach-soft-hover: #f9dcd5; --band: #f3f6f4;
      --shadow: 0 1px 2px rgb(21 32 27 / 4%), 0 12px 32px -18px rgb(21 32 27 / 18%); --float: 0 10px 30px -8px rgb(21 32 27 / 25%);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0e1311; --surface: #161c19; --sunken: #121715; --ink: #e5ebe8; --muted: #94a19b; --faint: #5d6963; --line: #252d29;
      --apple: #4cc27f; --apple-ink: #7ad7a0; --apple-soft: #173424; --apple-soft-hover: #1e4430; --peach: #f07a66; --peach-soft: #3a1f1a;
      --peach-soft-hover: #4a2720; --band: #1b221f;
      --shadow: none; --float: 0 10px 30px -8px rgb(0 0 0 / 60%);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    main { max-width: 1120px; margin: 0 auto; padding: 32px 24px 56px; }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--apple); outline-offset: 2px; }
    .icon { width: 16px; height: 16px; flex: none; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    header { margin-bottom: 20px; }
    h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
    h1 .icon { width: 26px; height: 26px; color: var(--apple); }
    .lede { margin: 6px 0 0; color: var(--muted); }
    .lede b { color: var(--ink); font-weight: 600; }
    details.problem { margin-top: 10px; }
    details.problem summary { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
    details.problem summary::-webkit-details-marker { display: none; }
    details.problem summary:hover { color: var(--ink); }
    .chev { width: 15px; height: 15px; transition: transform .15s; }
    details.problem[open] summary .chev, .row.open .toggle .chev { transform: rotate(90deg); }
    .problem-body {
      position: relative; margin-top: 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: 12px;
    }
    .problem-body pre { margin: 0; padding: 16px 52px 16px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.75; }
    .problem-body code { font: inherit; }
    .copy-btn { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s, color .15s; }
    .problem-body:hover .copy-btn, .problem-body:focus-within .copy-btn, .copy-btn.copied { opacity: 1; }
    .copy-btn:hover, .copy-btn.copied { color: var(--apple); border-color: currentColor; }
    @media (hover: none) { .copy-btn { opacity: 1; } }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; padding: 14px 16px; margin-bottom: 14px; }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field span { color: var(--muted); font-size: 12px; }
    .field select, .field input { height: 36px; padding: 0 10px; min-width: 120px; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; }
    .field input[type="number"] { width: 84px; min-width: 0; }
    .field .model-select { width: 200px; }
    .toolbar .spacer { flex: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 9px;
      border: 1px solid transparent; background: var(--apple-soft); color: var(--apple-ink); font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--apple-soft-hover); }
    .btn .icon { width: 15px; height: 15px; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; height: 32px; padding: 0 12px; }
    .btn.ghost:hover:not(:disabled) { background: transparent; border-color: var(--muted); }
    .btn.ghost .icon { width: 14px; height: 14px; color: var(--muted); }
    .btn.danger { background: var(--peach-soft); color: var(--peach); }
    .btn.danger:hover:not(:disabled) { background: var(--peach-soft-hover); }
    .btn:disabled { opacity: .55; cursor: default; }
    .toolbar .btn.ghost { height: 36px; }

    dialog.confirm { width: min(400px, calc(100vw - 32px)); padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--float); }
    dialog.confirm::backdrop { background: rgb(10 16 13 / 40%); }
    dialog.confirm h2 { margin: 0 0 6px; font-size: 16px; }
    dialog.confirm p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dialog-actions .btn { height: 34px; }

    .tip {
      position: fixed; z-index: 10; max-width: min(320px, calc(100vw - 16px)); padding: 10px 12px; pointer-events: none;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--float); font-size: 12px;
    }
    .tip-head, .latest-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tip-head { margin-bottom: 6px; }
    .tip .metrics { margin-top: 6px; }
    .tip-text { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .tip-text.error { color: var(--peach); }

    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--muted); font-size: 12px; margin: 0 4px 10px; }
    .legend .grow { flex: 1; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .legend .flash { color: var(--peach); }
    .legend .flash:empty { display: none; }
    .legend .flash, .legend #rate-scope { min-width: 0; white-space: normal; overflow-wrap: anywhere; }

    .mark { width: 15px; height: 15px; flex: none; }
    .mark.ok { color: var(--apple); }
    .mark.bad { color: var(--peach); }
    .mark.err { color: var(--faint); }
    .mark.dim { opacity: .3; }

    .table-head, .row-main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.8fr) 76px 208px 118px; gap: 14px; align-items: center; }
    .table-head { padding: 10px 18px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .table-head > :first-child { padding-left: 20px; }
    .row { border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row-main { padding: 14px 18px; cursor: pointer; }
    .row-main:hover, .row.open .row-main { background: var(--sunken); }
    .account { min-width: 0; }
    .toggle { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; padding: 0; border: 0; background: none; font-weight: 600; cursor: pointer; text-align: left; }
    .toggle .chev { color: var(--faint); }
    .toggle .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account .tags { display: flex; flex-wrap: wrap; gap: 5px; padding-left: 20px; margin-top: 4px; }
    .account .name { transition: filter .15s; }
    .masked .account .name { filter: blur(5px); user-select: none; }
    .tag { max-width: 100%; padding: 0 6px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .latest { min-width: 0; }
    .verdict { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .verdict .icon, .metric .icon, .model-meta .icon { width: 13px; height: 13px; }
    .verdict.ok { background: var(--apple-soft); color: var(--apple-ink); }
    .verdict.bad { background: var(--peach-soft); color: var(--peach); }
    .verdict.err { background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
    .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .metrics { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; max-width: 100%; color: var(--muted); font-size: 12px; }
    .latest .metrics { margin-top: 5px; }
    .metric { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .model-meta { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
    .model-meta .meta { min-width: 0; }
    .none { color: var(--faint); }

    .rate b { font-size: 17px; font-weight: 600; }
    .rate small { display: block; color: var(--faint); font-size: 12px; }
    .marks { display: grid; grid-template-columns: repeat(auto-fit, 19px); gap: 2px; align-items: center; width: 100%; max-width: 208px; min-width: 0; min-height: 19px; }
    .mark-hit { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; padding: 2px; border: 0; border-radius: 50%; background: transparent; cursor: help; transition: transform .15s, background .15s, box-shadow .15s; }
    .mark-hit:hover, .mark-hit:focus-visible { position: relative; z-index: 1; background: var(--surface); box-shadow: 0 0 0 2px var(--line); transform: scale(1.2); }
    .mark-hit:hover .mark, .mark-hit:focus-visible .mark { opacity: 1; }
    .action { text-align: right; }

    .details { padding: 4px 18px 16px; background: var(--sunken); }
    .history { display: grid; gap: 8px; }
    .entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .entry-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 8px 12px; background: var(--band); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .entry-head .when { color: var(--ink); }
    .entry-answer { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.65; }
    .answer-toggle { display: inline-flex; align-items: center; gap: 2px; flex: none; padding: 0 3px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
    .answer-toggle:hover { color: var(--apple-ink); background: var(--apple-soft); }
    .entry-answer.expanded .chev { transform: rotate(90deg); }
    .entry-body { flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit; }
    .entry-answer.expanded .entry-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .entry-body.error { color: var(--peach); }

    .empty, .notice { padding: 40px 20px; text-align: center; color: var(--muted); }
    .notice.error { color: var(--peach); }
    .login { max-width: 380px; margin: 12vh auto 0; padding: 24px; }
    .login h2 { margin: 0 0 6px; font-size: 17px; }
    .login p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .login form { display: flex; gap: 8px; }
    .login input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; }
    .login .error { margin: 10px 0 0; color: var(--peach); }
    [hidden] { display: none !important; }

    @media (max-width: 1000px) {
      main { padding: 20px 14px 40px; }
      .table-head { display: none; }
      .row-main { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "account action" "latest latest" "rate marks"; gap: 10px 12px; }
      .account { grid-area: account; } .latest { grid-area: latest; } .rate { grid-area: rate; } .marks { grid-area: marks; width: 208px; } .action { grid-area: action; }
      .rate b { font-size: 15px; } .rate small { display: inline; margin-left: 6px; }
      .toolbar .spacer { display: none; }
      .toolbar .field { flex: 1 1 120px; }
      .toolbar .field select, .toolbar .field input { width: 100%; min-width: 0; }
      .toolbar .btn { flex: 1 1 140px; }
      .legend .grow { flex-basis: 100%; }
    }
    @media (max-width: 480px) {
      .row-main { grid-template-areas: "account account" "latest latest" "rate action" "marks marks"; }
      .marks { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; }
      .mark-hit, .copy-btn, .chev, .account .name { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><i data-icon="candy"></i>Codex 糖果测试</h1>
      <p class="lede">让每个 Codex 账号解同一道糖果题，答出 <b class="mono">21</b> 即为正确，用来发现降智账号。</p>
      <details class="problem">
        <summary><i data-icon="chevron-right" data-class="chev"></i>查看题目</summary>
        <div class="problem-body">
          <pre class="mono"><code id="question"></code></pre>
          <button id="copy" class="copy-btn" type="button" aria-label="复制题目" title="复制题目"></button>
        </div>
      </details>
    </header>

    <section id="login" class="card login" hidden>
      <h2>连接 CPA</h2>
      <p>输入 CPA 管理密钥。登录 CPA 管理面板时勾选「记住密码」，此页即可自动使用面板的密钥。</p>
      <form id="login-form">
        <input id="login-key" type="password" autocomplete="current-password" placeholder="管理密钥" aria-label="管理密钥" required>
        <button class="btn" type="submit">连接</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <div id="app" hidden>
      <form id="toolbar" class="card toolbar">
        <label class="field"><span>模型</span><select id="model" class="model-select"></select></label>
        <label class="field"><span>推理强度</span><select id="effort"></select></label>
        <label class="field"><span>每个账号测试次数</span><input id="runs" class="mono" type="number" min="1" max="10" value="1"></label>
        <div class="spacer"></div>
        <button id="run-all" class="btn" type="submit" disabled></button>
        <button id="clear" class="btn ghost" type="button" disabled></button>
        <button id="mask" class="btn ghost" type="button"></button>
      </form>

      <div class="legend">
        <span><i data-icon="circle-check" data-class="mark ok"></i>答对</span>
        <span><i data-icon="circle-x" data-class="mark bad"></i>答错</span>
        <span><i data-icon="circle-alert" data-class="mark err"></i>请求出错</span>
        <span><i data-icon="circle-check" data-class="mark ok dim"></i>其他模型或推理强度</span>
        <span class="grow"></span>
        <span id="flash" class="flash" role="alert"></span>
        <span id="rate-scope"></span>
      </div>

      <section class="card">
        <div class="table-head">
          <div>账号</div>
          <div>最近一次</div>
          <div>正确率</div>
          <div>最近 20 次</div>
          <div></div>
        </div>
        <div id="rows"><div class="notice">正在加载…</div></div>
      </section>
    </div>

    <dialog id="confirm-clear" class="confirm">
      <form method="dialog">
        <h2>清空全部测试记录？</h2>
        <p>所有账号的历史测试结果都会被删除，且无法恢复。正在进行的测试不受影响，完成后会照常记录。</p>
        <div class="dialog-actions">
          <button class="btn ghost" value="cancel" autofocus>取消</button>
          <button class="btn danger" value="confirm">清空记录</button>
        </div>
      </form>
    </dialog>
    <div id="tip" class="tip" role="tooltip" hidden></div>
  </main>

  <script>
    "use strict";
    const BASE = "/v0/management/plugins/cpa-codex-candy-eval";
    const KEY_STORE = "cpa-codex-candy-eval.key";
    const PREF_STORE = "cpa-codex-candy-eval.prefs";
    const MASK_STORE = "cpa-codex-candy-eval.masked";
    const DEFAULT_MODEL = "gpt-5.6-sol";
    const DEFAULT_EFFORT = "low";
    const DEFAULT_EFFORTS = ["low", "medium", "high", "xhigh"];
    const HIDDEN_MODEL = (id) => id.startsWith("gpt-image-") || id === "codex-auto-review";
    // The exact prompt sent to the models, injected by the plugin.
    const PROMPT = /*CANDY_PROMPT*/"";

    // Lucide icons (https://lucide.dev, ISC license).
    const ICONS = {
      candy: '<path d="M10 7v10.9"/><path d="M14 6.1V17"/><path d="M16 7V3a1 1 0 0 1 1.707-.707 2.5 2.5 0 0 0 2.152.717 1 1 0 0 1 1.131 1.131 2.5 2.5 0 0 0 .717 2.152A1 1 0 0 1 21 8h-4"/><path d="M16.536 7.465a5 5 0 0 0-7.072 0l-2 2a5 5 0 0 0 0 7.07 5 5 0 0 0 7.072 0l2-2a5 5 0 0 0 0-7.07"/><path d="M8 17v4a1 1 0 0 1-1.707.707 2.5 2.5 0 0 0-2.152-.717 1 1 0 0 1-1.131-1.131 2.5 2.5 0 0 0-.717-2.152A1 1 0 0 1 3 16h4"/>',
      "chevron-right": '<path d="m9 18 6-6-6-6"/>',
      copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      "arrow-down": '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
      "arrow-up": '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
      brain: '<path d="M12 18V5a3 3 0 0 0-5.997-.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 18V5a3 3 0 0 1 5.997-.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4M6 17a4 4 0 0 1-1.967-.767M18 17a4 4 0 0 0 1.967-.767"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
      cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
      "circle-check": '<circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/>',
      "circle-x": '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
      "circle-alert": '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
      "loader-circle": '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
      play: '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>',
      eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
      "eye-off": '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',
      "trash-2": '<path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    };
    const icon = (name, cls = "") =>
      `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    let key = "";
    let auths = [];
    let models = [];
    let pollTimer = 0;
    let loadVersion = 0;
    let loadError = "";
    let pending = false;
    let tipTarget = null;
    const expanded = new Set();
    const expandedAnswers = new Set();

    document.querySelectorAll("[data-icon]").forEach((el) => { el.outerHTML = icon(el.dataset.icon, el.dataset.class); });
    $("question").textContent = PROMPT;

    const COPY_LABEL = icon("copy");
    let copyTimer = 0;
    $("copy").innerHTML = COPY_LABEL;
    $("copy").addEventListener("click", async () => {
      try {
        try {
          await navigator.clipboard.writeText(PROMPT);
        } catch (_) {
          const area = Object.assign(document.createElement("textarea"), { value: PROMPT });
          area.style.cssText = "position:fixed;opacity:0";
          document.body.append(area);
          try {
            area.select();
            if (!document.execCommand("copy")) throw new Error("copy failed");
          } finally {
            area.remove();
            $("copy").focus();
          }
        }
      } catch (_) {
        $("copy").setAttribute("aria-label", "复制失败，请重试");
        $("copy").title = "复制失败，请重试";
        return;
      }
      clearTimeout(copyTimer);
      $("copy").innerHTML = icon("check");
      $("copy").classList.add("copied");
      $("copy").setAttribute("aria-label", "已复制");
      $("copy").title = "已复制";
      copyTimer = setTimeout(() => {
        $("copy").innerHTML = COPY_LABEL;
        $("copy").classList.remove("copied");
        $("copy").setAttribute("aria-label", "复制题目");
        $("copy").title = "复制题目";
      }, 1600);
    });

    // The CPA management panel keeps its state in same-origin localStorage, optionally obfuscated.
    function panelValue(name) {
      try {
        let raw = localStorage.getItem(name);
        if (!raw) return null;
        const prefix = "enc::v1::";
        if (raw.startsWith(prefix)) {
          const secret = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + "|" + navigator.userAgent);
          const bin = atob(raw.slice(prefix.length));
          const bytes = Uint8Array.from(bin, (c, i) => c.charCodeAt(0) ^ secret[i % secret.length]);
          raw = new TextDecoder().decode(bytes);
        }
        return JSON.parse(raw);
      } catch (_) { return null; }
    }

    function applyTheme() {
      const theme = panelValue("cli-proxy-theme")?.state?.theme;
      const dark = theme === "dark" || (theme !== "white" && theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }
    applyTheme();
    addEventListener("storage", applyTheme);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

    function panelKey() {
      const k = panelValue("cli-proxy-auth")?.state?.managementKey;
      return typeof k === "string" ? k.trim() : "";
    }

    class AuthError extends Error {}

    async function api(path, { method = "GET", body } = {}) {
      const init = { method, cache: "no-store", headers: { Authorization: "Bearer " + key } };
      if (body !== undefined) {
        init.headers["Content-Type"] = "application/json";
        init.body = JSON.stringify(body);
      }
      const resp = await fetch(path, init);
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch (_) {}
      if (resp.status === 401) throw new AuthError("管理密钥无效，请重新输入。");
      if (!resp.ok) {
        const err = data?.error;
        throw new Error((typeof err === "string" ? err : err?.message) || text || "HTTP " + resp.status);
      }
      return data;
    }

    function stored(name) {
      try { return JSON.parse(localStorage.getItem(name)); } catch (_) { return null; }
    }
    function store(name, value) {
      try { localStorage.setItem(name, JSON.stringify(value)); } catch (_) {}
    }
    const prefs = () => stored(PREF_STORE) || {};
    const savePrefs = () => store(PREF_STORE, { model: $("model").value, effort: $("effort").value, runs: runs() });
    const runs = () => Math.min(Math.max(parseInt($("runs").value, 10) || 1, 1), 10);

    function fillModels() {
      const saved = prefs();
      const ids = [...new Set(models.map((m) => m.id))];
      const preferred = typeof saved.model === "string" && !HIDDEN_MODEL(saved.model) ? saved.model : DEFAULT_MODEL;
      if (preferred && !ids.includes(preferred)) ids.unshift(preferred);
      if (!ids.includes(DEFAULT_MODEL)) ids.unshift(DEFAULT_MODEL);
      $("model").innerHTML = ids.map((id) => `<option>${esc(id)}</option>`).join("");
      $("model").value = preferred || DEFAULT_MODEL;
      if (saved.runs) { $("runs").value = saved.runs; $("runs").value = runs(); }
      fillEfforts(saved.effort || DEFAULT_EFFORT);
    }

    function fillEfforts(preferred) {
      const configured = models.find((m) => m.id === $("model").value)?.thinking?.levels;
      const levels = configured?.length ? configured : DEFAULT_EFFORTS;
      $("effort").innerHTML = levels.map((l) => `<option>${esc(l)}</option>`).join("");
      $("effort").value = levels.includes(preferred) ? preferred : levels.includes(DEFAULT_EFFORT) ? DEFAULT_EFFORT : levels[0];
    }

    const scopeMatch = (r) => r.model === $("model").value && r.effort === $("effort").value;
    const kind = (r) => (r.error ? "err" : r.ok ? "ok" : "bad");
    const VERDICT = { ok: "答对", bad: "答错", err: "出错" };
    const MARK = { ok: "circle-check", bad: "circle-x", err: "circle-alert" };
    const fmtNum = (n) => (n ? Number(n).toLocaleString("en-US") : "0");
    const fmtSec = (ms) => (ms / 1000).toFixed(1) + "s";
    function fmtTime(iso, withYear = false) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, "0");
      return `${withYear ? d.getFullYear() + "-" : ""}${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    const oneLine = (s) => String(s || "").replace(/\s+/g, " ").trim();
    const modelName = (r) => r.effort ? `${r.model}(${r.effort})` : r.model;
    const modelMeta = (r) => `<span class="model-meta" title="${esc(modelName(r))}">${icon("cpu")}<span class="meta mono">${esc(modelName(r))}</span></span>`;
    const verdict = (r) => `<span class="verdict ${kind(r)}">${icon(MARK[kind(r)])}${VERDICT[kind(r)]}</span>`;
    const metric = (name, label, value) => `<span class="metric mono" title="${esc(label)}" aria-label="${esc(`${label} ${value}`)}">${icon(name)}<span>${esc(value)}</span></span>`;
    const metrics = (r) => metric("clock", "用时", fmtSec(r.duration_ms)) +
      metric("arrow-down", "输入 tokens", fmtNum(r.input_tokens)) +
      metric("arrow-up", "输出 tokens", fmtNum(r.output_tokens)) +
      metric("brain", "推理 tokens", fmtNum(r.reasoning_tokens));
    const PLAN_NAMES = {
      free: "Free", plus: "Plus", team: "Team", pro: "Pro 20x",
      prolite: "Pro 5x", "pro-lite": "Pro 5x", pro_lite: "Pro 5x",
      self_serve_business_prolite: "Business Premium",
    };
    function planName(plan) {
      const name = String(plan || "").trim();
      return Object.hasOwn(PLAN_NAMES, name.toLowerCase()) ? PLAN_NAMES[name.toLowerCase()] : name || "其他";
    }
    const answerKey = (id, r) => JSON.stringify([id, r.time, r.model, r.effort]);
    const answerToggle = (open) => `${icon("chevron-right", "chev")}${open ? "收起" : "展开"}`;

    function renderRow(a) {
      const results = a.results;
      const last = results[results.length - 1];
      const graded = results.filter((r) => scopeMatch(r) && !r.error);
      const correct = graded.filter((r) => r.ok).length;
      const open = expanded.has(a.id);

      const latest = last
        ? `<div class="latest-top">${verdict(last)}
             ${modelMeta(last)}</div>
           <div class="metrics">${metrics(last)}</div>`
        : `<span class="none">尚未测试</span>`;
      const rate = graded.length
        ? `<b class="mono">${Math.round((correct / graded.length) * 100)}%</b><small class="mono">${correct}/${graded.length}</small>`
        : `<span class="none">—</span>`;
      const marks = results.map((r, i) => `<button class="mark-hit" type="button" data-auth="${esc(a.id)}" data-i="${i}" aria-label="${esc(`${fmtTime(r.time)} ${modelName(r)} ${VERDICT[kind(r)]}`)}">${icon(MARK[kind(r)], `mark ${kind(r)} ${scopeMatch(r) ? "" : "dim"}`)}</button>`).join("");
      const action = a.running
        ? `<button class="btn ghost" type="button" disabled>${icon("loader-circle", "spin")}测试中 <span class="mono">${a.running.done}/${a.running.total}</span></button>`
        : `<button class="btn ghost" type="button" data-run="${esc(a.id)}" ${pending ? "disabled" : ""}>${icon("play")}测试</button>`;

      const history = open ? [...results].reverse().map((r, i) => {
        const key = answerKey(a.id, r);
        const answerOpen = expandedAnswers.has(key);
        const bodyID = `answer-${encodeURIComponent(a.id)}-${i}`;
        return `
        <div class="entry">
          <div class="entry-head">${verdict(r)}<span class="when">${metric("calendar", "测试时间", fmtTime(r.time, true))}</span>${modelMeta(r)}
            <span class="metrics">${metrics(r)}</span></div>
          <div class="entry-answer ${answerOpen ? "expanded" : ""}">
            <button class="answer-toggle" type="button" data-answer="${esc(key)}" aria-expanded="${answerOpen}" aria-controls="${esc(bodyID)}" aria-label="${answerOpen ? "收起文本" : "展开文本"}">${answerToggle(answerOpen)}</button>
            <pre id="${esc(bodyID)}" class="entry-body ${r.error ? "error" : ""}">${esc(r.error || r.answer)}</pre>
          </div>
        </div>`;
      }).join("") : "";

      return `<div class="row ${open ? "open" : ""}">
        <div class="row-main" data-row="${esc(a.id)}">
          <div class="account">
            <button class="toggle" type="button" data-toggle="${esc(a.id)}" aria-expanded="${open}">${icon("chevron-right", "chev")}<span class="name">${esc(a.email || a.name)}</span></button>
            <div class="tags"><span class="tag">${esc(planName(a.plan_type))}</span>${a.disabled ? `<span class="tag">已停用</span>` : ""}</div>
          </div>
          <div class="latest">${latest}</div>
          <div class="rate">${rate}</div>
          <div class="marks">${marks}</div>
          <div class="action">${action}</div>
        </div>
        ${open ? `<div class="details"><div class="history">${history || `<div class="empty">还没有测试记录，点击「测试」开始。</div>`}</div></div>` : ""}
      </div>`;
    }

    function render() {
      $("rate-scope").textContent = `正确率按 ${modelName({ model: $("model").value, effort: $("effort").value })} 统计`;
      const enabled = auths.filter((a) => !a.disabled).length;
      $("run-all").innerHTML = `${icon("play")}测试全部 (${enabled})`;
      $("run-all").disabled = pending || !enabled || auths.every((a) => a.disabled || a.running);
      $("clear").disabled = pending || auths.every((a) => !a.results.length);
      hideTip();
      const focused = document.activeElement?.closest?.("[data-toggle], [data-run], [data-answer], [data-auth]");
      const focusAttr = focused && ["data-toggle", "data-run", "data-answer", "data-auth"].find((attr) => focused.hasAttribute(attr));
      const focusSelector = focusAttr && `[${focusAttr}="${CSS.escape(focused.getAttribute(focusAttr))}"]` +
        (focusAttr === "data-auth" ? `[data-i="${focused.dataset.i}"]` : "");
      $("rows").innerHTML = auths.length
        ? auths.map(renderRow).join("")
        : `<div class="empty">没有 Codex 认证文件。在 CPA 中添加 Codex 账号后刷新此页。</div>`;
      if (focusSelector) $("rows").querySelector(focusSelector)?.focus({ preventScroll: true });
    }

    async function load() {
      const version = ++loadVersion;
      clearTimeout(pollTimer);
      try {
        const data = await api(BASE + "/state");
        if (version !== loadVersion) return;
        auths = data.auths || [];
        if ($("flash").textContent === loadError) $("flash").textContent = "";
        loadError = "";
        const ids = new Set(auths.map((a) => a.id));
        const answers = new Set(auths.flatMap((a) => a.results.map((r) => answerKey(a.id, r))));
        for (const id of expanded) if (!ids.has(id)) expanded.delete(id);
        for (const id of expandedAnswers) if (!answers.has(id)) expandedAnswers.delete(id);
        render();
      } catch (err) {
        if (version !== loadVersion) return;
        if (err instanceof AuthError) return showLogin(err.message);
        loadError = "读取测试结果失败：" + err.message;
        if (auths.length) $("flash").textContent = loadError;
        else $("rows").innerHTML = `<div class="notice error">${esc(loadError)}</div>`;
      }
      pollTimer = setTimeout(load, auths.some((a) => a.running) ? 2500 : 20000);
    }

    async function update(path, options, errorPrefix) {
      if (pending) return;
      pending = true;
      ++loadVersion;
      clearTimeout(pollTimer);
      $("flash").textContent = "";
      render();
      try {
        await api(BASE + path, options);
      } catch (err) {
        if (err instanceof AuthError) return showLogin(err.message);
        $("flash").textContent = errorPrefix + "：" + err.message;
      } finally {
        if (!$("app").hidden) await load();
        pending = false;
        if (!$("app").hidden && auths.length) render();
      }
    }

    function run(body) {
      savePrefs();
      return update("/run", { method: "POST", body: { ...body, model: $("model").value, effort: $("effort").value, runs: runs() } }, "开始测试失败");
    }

    function showLogin(message) {
      ++loadVersion;
      clearTimeout(pollTimer);
      hideTip();
      $("app").hidden = true;
      $("login").hidden = false;
      $("login-error").hidden = !message;
      $("login-error").textContent = message || "";
      $("login-key").focus();
    }

    async function start() {
      clearTimeout(pollTimer);
      const version = ++loadVersion;
      $("login").hidden = true;
      $("app").hidden = false;
      try {
        const data = await api("/v0/management/model-definitions/codex");
        if (version !== loadVersion) return;
        models = (data.models || []).filter((m) => !HIDDEN_MODEL(m.id));
      } catch (err) {
        if (version !== loadVersion) return;
        if (err instanceof AuthError) return showLogin(err.message);
      }
      fillModels();
      load();
    }

    function showTip(target) {
      const r = auths.find((a) => a.id === target.dataset.auth)?.results[target.dataset.i];
      if (!r) return;
      hideTip();
      const tip = $("tip");
      tip.innerHTML = `<div class="tip-head">${verdict(r)}${modelMeta(r)}</div>
        <div class="metrics">${metric("calendar", "测试时间", fmtTime(r.time, true))}</div>
        <div class="metrics">${metrics(r)}</div>
        <div class="tip-text ${r.error ? "error" : ""}">${esc(oneLine(r.error || r.answer))}</div>`;
      tip.hidden = false;
      const box = target.getBoundingClientRect();
      const { width, height } = tip.getBoundingClientRect();
      const left = Math.min(Math.max(box.left + box.width / 2 - width / 2, 8), innerWidth - width - 8);
      const top = box.top - height - 8 >= 8 ? box.top - height - 8 : Math.max(8, Math.min(box.bottom + 8, innerHeight - height - 8));
      tip.style.left = left + "px";
      tip.style.top = top + "px";
      target.setAttribute("aria-describedby", "tip");
      tipTarget = target;
    }
    function hideTip() {
      $("tip").hidden = true;
      tipTarget?.removeAttribute("aria-describedby");
      tipTarget = null;
    }
    $("rows").addEventListener("mouseover", (e) => {
      const target = e.target.closest("[data-auth]");
      if (target?.contains(e.relatedTarget)) return;
      target ? showTip(target) : hideTip();
    });
    $("rows").addEventListener("mouseleave", hideTip);
    $("rows").addEventListener("focusin", (e) => {
      const target = e.target.closest("[data-auth]");
      target ? showTip(target) : hideTip();
    });
    $("rows").addEventListener("focusout", hideTip);
    $("rows").addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
    addEventListener("scroll", hideTip, true);
    addEventListener("resize", hideTip);

    function setMasked(masked) {
      document.body.classList.toggle("masked", masked);
      $("mask").setAttribute("aria-pressed", masked);
      $("mask").innerHTML = masked ? icon("eye") + "取消脱敏" : icon("eye-off") + "脱敏";
    }
    setMasked(stored(MASK_STORE) === true);
    $("mask").addEventListener("click", () => {
      const masked = !document.body.classList.contains("masked");
      setMasked(masked);
      store(MASK_STORE, masked);
    });

    $("clear").innerHTML = icon("trash-2") + "清空历史";
    $("clear").addEventListener("click", () => {
      $("confirm-clear").returnValue = ""; // Esc keeps the previous returnValue.
      $("confirm-clear").showModal();
    });
    $("confirm-clear").addEventListener("close", () => {
      if ($("confirm-clear").returnValue !== "confirm") return;
      update("/results", { method: "DELETE" }, "清空历史失败");
    });

    $("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      key = $("login-key").value.trim();
      try { sessionStorage.setItem(KEY_STORE, key); } catch (_) {}
      start();
    });
    $("toolbar").addEventListener("submit", (e) => { e.preventDefault(); run({ all: true }); });
    $("model").addEventListener("change", () => { fillEfforts($("effort").value); savePrefs(); render(); });
    $("effort").addEventListener("change", () => { savePrefs(); render(); });
    $("runs").addEventListener("change", () => { $("runs").value = runs(); savePrefs(); });
    $("rows").addEventListener("click", (e) => {
      const hit = e.target.closest("[data-auth]");
      if (hit) return showTip(hit);
      const answer = e.target.closest("[data-answer]");
      if (answer) {
        const key = answer.dataset.answer;
        const open = !expandedAnswers.has(key);
        open ? expandedAnswers.add(key) : expandedAnswers.delete(key);
        answer.closest(".entry-answer").classList.toggle("expanded", open);
        answer.setAttribute("aria-expanded", open);
        answer.setAttribute("aria-label", open ? "收起文本" : "展开文本");
        answer.innerHTML = answerToggle(open);
        return;
      }
      const btn = e.target.closest("[data-run]");
      if (btn) return run({ auth_ids: [btn.dataset.run] });
      const row = e.target.closest("[data-row]");
      if (!row) return;
      const id = row.dataset.row;
      expanded.has(id) ? expanded.delete(id) : expanded.add(id);
      render();
    });

    key = panelKey();
    if (!key) { try { key = sessionStorage.getItem(KEY_STORE) || ""; } catch (_) {} }
    key ? start() : showLogin("");
  </script>
</body>
</html>
